<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prep Roadmap — Interview Brain</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .split-layout { display: flex; min-height: 100vh; }

    /* ── Sidebar ────────────────────────────────────────── */
    .sidebar {
      width: 300px; flex-shrink: 0; padding: 24px 20px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow-y: auto;
    }
    
    .sidebar-header {
      margin-bottom: 24px;
    }

    .roadmap-list {
      display: flex; flex-direction: column; gap: 8px;
    }
    .roadmap-item {
      padding: 12px 16px; border-radius: 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      cursor: pointer; transition: all 0.2s;
    }
    .roadmap-item:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.1);
    }
    .roadmap-item.active {
      background: var(--accent-glow);
      border-color: var(--accent);
    }
    .roadmap-item-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
    .roadmap-item-date { font-size: 0.75rem; color: var(--text-muted); }

    /* ── Main Panel ─────────────────────────────────────── */
    .main-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    .top-bar {
      display: flex; align-items: center; gap: 16px; padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
    }
    
    .content-area {
      flex: 1; padding: 32px; overflow-y: auto;
      display: flex; flex-direction: column;
    }
    
    /* ── Roadmap Viewer / Editor ────────────────────────── */
    .roadmap-container {
      max-width: 800px; width: 100%; margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex; flex-direction: column;
      flex: 1;
    }
    
    .roadmap-header {
      padding: 20px 24px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    
    .roadmap-body {
      padding: 24px; flex: 1; display: flex; flex-direction: column;
    }
    
    /* Rendered view styles */
    #roadmap-rendered {
      font-size: 0.95rem; line-height: 1.6;
    }
    #roadmap-rendered ul { list-style: none; padding-left: 0; }
    #roadmap-rendered li { margin-bottom: 8px; display: flex; align-items: flex-start; gap: 10px; }
    #roadmap-rendered input[type="checkbox"] {
      margin-top: 4px; accent-color: var(--accent);
      width: 16px; height: 16px; cursor: pointer;
    }
    #roadmap-rendered strong { color: var(--accent); }
    #roadmap-rendered h1, #roadmap-rendered h2, #roadmap-rendered h3 {
      margin-top: 24px; margin-bottom: 12px;
    }
    
    /* Edit view styles */
    #roadmap-editor {
      width: 100%; flex: 1; min-height: 400px;
      background: var(--bg-elevated); color: var(--text-primary);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; font-family: monospace; font-size: 0.9rem;
      resize: vertical;
    }
    
    .hidden { display: none !important; }

    @media (max-width: 768px) {
      .split-layout { flex-direction: column; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); max-height: 300px; }
    }
  </style>
</head>
<body>

  <div class="split-layout">

    <!-- ── Sidebar (Saved Roadmaps) ──────────────────────── -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/static/dashboard.html" class="text-muted" style="font-size: 0.85rem; display: inline-block; margin-bottom: 16px;">&larr; Back to Dashboard</a>
        <h2 style="font-size: 1.2rem; font-weight: 600;">My Roadmaps</h2>
      </div>
      
      <div id="roadmap-list" class="roadmap-list">
        <div style="padding: 8px; font-size: 0.85rem; color: var(--text-muted);">
          Loading...
        </div>
      </div>
    </aside>

    <!-- ── Main Panel ───────────────────────────────────── -->
    <main class="main-panel">

      <!-- Top bar: Generate new roadmap -->
      <div class="top-bar">
        <div style="font-weight: 600; font-size: 0.95rem;">Generate New:</div>
        <select class="form-input" id="new-company" style="max-width: 200px;"></select>
        <select class="form-input" id="new-days" style="max-width: 150px;">
          <option value="7">7 Days</option>
          <option value="14">14 Days</option>
          <option value="30" selected>30 Days</option>
          <option value="60">60 Days</option>
        </select>
        <button class="btn btn-primary" id="btn-generate">Generate</button>
      </div>

      <!-- Roadmap Viewer/Editor -->
      <div class="content-area">
        
        <!-- Empty State -->
        <div id="empty-state" style="text-align: center; padding: 60px 20px; color: var(--text-muted);">
          Select a roadmap from the sidebar, or generate a new one above.
        </div>
        
        <!-- Loading State -->
        <div id="loading-state" class="hidden" style="text-align: center; padding: 60px 20px;">
          <div class="spinner" style="width: 24px; height: 24px; margin: 0 auto 16px;"></div>
          <p style="color: var(--text-muted);">Generating your personalized roadmap via Cognee... This takes a few seconds.</p>
        </div>

        <!-- Content State -->
        <div id="content-state" class="roadmap-container hidden">
          <div class="roadmap-header">
            <h2 id="view-title" style="font-size: 1.2rem; font-weight: 600;">Loading...</h2>
            <div>
              <button class="btn btn-ghost" id="btn-edit">Edit Roadmap</button>
              <button class="btn btn-primary hidden" id="btn-save">Save Changes</button>
            </div>
          </div>
          
          <div class="roadmap-body">
            <div id="roadmap-rendered"></div>
            <textarea id="roadmap-editor" class="hidden"></textarea>
          </div>
        </div>
        
      </div>

    </main>
  </div>

  <script src="/static/js/api.js?v=2" defer></script>
  <script src="/static/js/roadmap.js?v=2" defer></script>
</body>
</html>
